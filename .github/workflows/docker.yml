name: Docker Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image serveur (version + latest)
        run: |
          docker build -t safaj/mern-server:${{ github.run_number }} -t safaj/mern-server:latest ./server

      - name: Scan securite serveur (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity LOW,MEDIUM,HIGH,CRITICAL safaj/mern-server:latest

      - name: Push image serveur
        run: |
          docker push safaj/mern-server:${{ github.run_number }}
          docker push safaj/mern-server:latest

      - name: Build image client (version + latest)
        run: |
          docker build --build-arg REACT_APP_API_URL=http://localhost:9000 -t safaj/mern-client:${{ github.run_number }} -t safaj/mern-client:latest ./client

      - name: Scan securite client (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity LOW,MEDIUM,HIGH,CRITICAL safaj/mern-client:latest

      - name: Push image client
        run: |
          docker push safaj/mern-client:${{ github.run_number }}
          docker push safaj/mern-client:latest

      - name: Mettre a jour docker-compose.yml avec la nouvelle version
        run: |
          sed -i "s#safaj/mern-server:.*#safaj/mern-server:${{ github.run_number }}#" docker-compose.yml
          sed -i "s#safaj/mern-client:.*#safaj/mern-client:${{ github.run_number }}#" docker-compose.yml

      - name: Commit et push du docker-compose.yml
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update docker-compose vers version ${{ github.run_number }} [skip ci]"
          file_pattern: docker-compose.yml
