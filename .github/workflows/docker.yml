name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image serveur
        run: docker build -t safaj/mern-server:latest ./server

      - name: Push image serveur
        run: docker push safaj/mern-server:latest

      - name: Build image client
        run: docker build --build-arg REACT_APP_API_URL=http://localhost:9000 -t safaj/mern-client:latest ./client

      - name: Push image client
        run: docker push safaj/mern-client:latest
