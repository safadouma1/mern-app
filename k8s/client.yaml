apiVersion: apps/v1
kind: Deployment
metadata:
  name: mern-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mern-client
  template:
    metadata:
      labels:
        app: mern-client
    spec:
      containers:
        - name: mern-client
          image: safaj/mern-client:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: mern-client
spec:
  type: NodePort
  selector:
    app: mern-client
  ports:
    - port: 80
      targetPort: 80
